# One-Time: Find Claudia Zelaya-Vasquez's duplicate "Bella" dog records
#
# Read-only. Lists both dog rows and how much linked data (appointments,
# vaccination records, documents, report cards) each one has, so the
# duplicate can be merged/removed without losing history.
#
# Meant to be deleted once it's been run and the results reviewed.

name: One-Time - Find Duplicate Bella

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Install MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Query dog records and linked data
        run: |
          set -euo pipefail
          MYSQL="mysql --host=$DB_HOST --port=${DB_PORT:-3306} --user=$DB_USERNAME --password=$DB_PASSWORD -t $DB_DATABASE"

          echo "### Dog rows for Claudia Zelaya-Vasquez named Bella"
          $MYSQL -e "SELECT d.id, d.name, d.breed, d.created_at, d.is_active, d.is_archived FROM dogs d JOIN users u ON u.id = d.user_id WHERE u.name LIKE '%Claudia%Zelaya%' AND LOWER(d.name) = 'bella' ORDER BY d.id;"

          echo "### Appointment links per dog id"
          $MYSQL -e "SELECT dog_id, COUNT(*) FROM appointment_dog JOIN dogs d ON d.id = appointment_dog.dog_id JOIN users u ON u.id = d.user_id WHERE u.name LIKE '%Claudia%Zelaya%' AND LOWER(d.name)='bella' GROUP BY dog_id;"

          echo "### Vaccination record counts per dog id"
          $MYSQL -e "SELECT dog_id, COUNT(*) FROM vaccination_records JOIN dogs d ON d.id = vaccination_records.dog_id JOIN users u ON u.id = d.user_id WHERE u.name LIKE '%Claudia%Zelaya%' AND LOWER(d.name)='bella' GROUP BY dog_id;"

          echo "### Client document counts per dog id"
          $MYSQL -e "SELECT dog_id, COUNT(*) FROM client_documents JOIN dogs d ON d.id = client_documents.dog_id JOIN users u ON u.id = d.user_id WHERE u.name LIKE '%Claudia%Zelaya%' AND LOWER(d.name)='bella' GROUP BY dog_id;"

          echo "### Recent visit reports for this client (dog_ids JSON)"
          $MYSQL -e "SELECT vr.id, vr.dog_ids, vr.created_at FROM visit_reports vr JOIN users u ON u.id = vr.user_id WHERE u.name LIKE '%Claudia%Zelaya%' ORDER BY vr.created_at DESC LIMIT 20;"
