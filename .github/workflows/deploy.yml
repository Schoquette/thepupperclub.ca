name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── API + Web Portal + Marketing Site + Community App → GoDaddy (FTP) ──
  # The marketing site used to publish to GitHub Pages (behind Cloudflare)
  # via a separate deploy-site job here; that job was removed once
  # everything moved onto one GoDaddy host -- this job's own "Deploy
  # marketing site to GoDaddy" step below is what actually publishes it now.
  deploy-godaddy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm install --workspace=web --workspace=shared --workspace=community

      - name: Build web portal
        run: cd web && npx vite build
        env:
          VITE_API_URL: https://thepupperclub.ca
          VITE_STRIPE_KEY: ${{ secrets.VITE_STRIPE_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}

      # Community member app (web build of the Tauri front-end). The
      # WEB_DEPLOY flag flips vite's `base` to /community/app/ so asset
      # URLs and the React Router basename line up with the deploy path.
      - name: Build community app
        run: cd community && WEB_DEPLOY=1 npx vite build
        env:
          VITE_API_URL: https://thepupperclub.ca
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: cd api && mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs && composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy API to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./api/
          server-dir: api/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/storage/logs/**
            **/storage/app/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            .env

      # Each FTP step writes its own state file so the steps don't
      # delete each other's files. Both target the GoDaddy web root,
      # but they manage disjoint file sets (React shell + marketing
      # static pages).
      - name: Deploy web portal build to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./web/dist/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-web.json

      - name: Deploy marketing site to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./site/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-site.json
          exclude: |
            **/.git*
            **/.git*/**
            **/deploy.log
            CNAME

      - name: Deploy community member app to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./community/dist/
          server-dir: community/app/
          state-name: .ftp-deploy-sync-state-community.json

      - name: Delete cached config before deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./api/bootstrap/cache/
          server-dir: api/bootstrap/cache/
          dangerous-clean-slate: true

      - name: Clear server config cache
        run: |
          sleep 5
          curl -s -o /dev/null -w "%{http_code}" https://thepupperclub.ca/api/clear-cache-9x7k || true

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true
