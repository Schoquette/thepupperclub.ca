# One-Time: Sync CRON_TRIGGER_SECRET to GoDaddy .env
#
# deploy.yml deliberately excludes .env from the FTP deploy, so this secret
# normally has to be set by hand in GoDaddy's panel. The user doesn't have
# access to that panel, so this patches just the CRON_TRIGGER_SECRET line in
# api/.env directly over FTP instead, using the same FTP_SERVER/FTP_USERNAME/
# FTP_PASSWORD secrets deploy.yml already uses. Every other line in .env is
# left untouched (verified by diff before upload).
#
# Meant to be deleted once it's been run successfully.

name: One-Time - Sync Cron Secret to GoDaddy

on:
  workflow_dispatch:

jobs:
  sync-secret:
    name: Patch CRON_TRIGGER_SECRET in api/.env
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      CRON_TRIGGER_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}

    steps:
      - name: Download current .env
        run: |
          set -euo pipefail
          curl -sf --user "${FTP_USERNAME}:${FTP_PASSWORD}" "ftp://${FTP_SERVER}/api/.env" -o env_original
          LINES=$(wc -l < env_original)
          EQUALS=$(grep -c '=' env_original || true)
          echo "Downloaded .env: ${LINES} lines, ${EQUALS} assignment-looking lines."
          if [ "$EQUALS" -lt 10 ]; then
            echo "::error::Downloaded file doesn't look like a real .env (too few '=' lines). Aborting without touching anything."
            exit 1
          fi

      - name: Patch CRON_TRIGGER_SECRET line only
        run: |
          set -euo pipefail
          cp env_original env_modified

          if grep -q '^CRON_TRIGGER_SECRET=' env_modified; then
            sed -i "s|^CRON_TRIGGER_SECRET=.*|CRON_TRIGGER_SECRET=${CRON_TRIGGER_SECRET}|" env_modified
            echo "Replaced existing CRON_TRIGGER_SECRET line."
          else
            printf '\nCRON_TRIGGER_SECRET=%s\n' "${CRON_TRIGGER_SECRET}" >> env_modified
            echo "Appended new CRON_TRIGGER_SECRET line."
          fi

          # Verify every other line is byte-for-byte unchanged.
          grep -v '^CRON_TRIGGER_SECRET=' env_original | sort > original_other_lines
          grep -v '^CRON_TRIGGER_SECRET=' env_modified | sort > modified_other_lines
          if ! diff -q original_other_lines modified_other_lines > /dev/null; then
            echo "::error::Unexpected diff outside the CRON_TRIGGER_SECRET line. Aborting without uploading."
            diff original_other_lines modified_other_lines || true
            exit 1
          fi
          echo "Verified: no other line changed."

      - name: Backup original .env (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: env-backup-before-cron-secret-sync-${{ github.run_id }}
          path: env_original
          retention-days: 1
          if-no-files-found: error

      - name: Upload patched .env
        run: |
          set -euo pipefail
          curl -sf --user "${FTP_USERNAME}:${FTP_PASSWORD}" -T env_modified "ftp://${FTP_SERVER}/api/.env"
          echo "Uploaded patched .env."

      - name: Verify the live file now has the right value
        run: |
          set -euo pipefail
          curl -sf --user "${FTP_USERNAME}:${FTP_PASSWORD}" "ftp://${FTP_SERVER}/api/.env" -o env_verify
          EXPECTED_HASH=$(printf 'CRON_TRIGGER_SECRET=%s' "${CRON_TRIGGER_SECRET}" | sha256sum | cut -d' ' -f1)
          ACTUAL_LINE=$(grep '^CRON_TRIGGER_SECRET=' env_verify || true)
          ACTUAL_HASH=$(printf '%s' "$ACTUAL_LINE" | sha256sum | cut -d' ' -f1)
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "::error::Live .env does not contain the expected CRON_TRIGGER_SECRET value after upload."
            exit 1
          fi
          echo "Verified: live .env now has the expected CRON_TRIGGER_SECRET value."

      - name: Clear cached Laravel config
        run: |
          sleep 2
          curl -s -o /dev/null -w "Cache-clear endpoint responded: %{http_code}\n" https://thepupperclub.ca/api/clear-cache-9x7k || true

      - name: Summary
        run: |
          echo "### CRON_TRIGGER_SECRET synced to GoDaddy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Patched api/.env over FTP, only that one line changed (diff-verified)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Backup of the pre-patch .env uploaded as an artifact (1-day retention) in case of rollback." >> "$GITHUB_STEP_SUMMARY"
          echo "- Laravel config cache cleared." >> "$GITHUB_STEP_SUMMARY"
