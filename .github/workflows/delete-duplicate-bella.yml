# One-Time: Delete duplicate Bella dog record (id 78)
#
# Dog id 78 is a duplicate of id 77 for Claudia Zelaya-Vasquez, created
# 5 seconds later by the intake-form double-save race (see commit
# 9629369 for the underlying fix). Confirmed via a prior read-only
# check that neither id has any linked appointments, vaccination
# records, documents, or visit reports, so this is a plain row delete
# with no merge needed. Backs up the row before deleting.
#
# Meant to be deleted once it's been run.

name: One-Time - Delete Duplicate Bella

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Install MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Safety re-check before deleting
        run: |
          set -euo pipefail
          MYSQL="mysql --host=$DB_HOST --port=${DB_PORT:-3306} --user=$DB_USERNAME --password=$DB_PASSWORD -N -B $DB_DATABASE"

          NAME=$($MYSQL -e "SELECT name FROM dogs WHERE id=78;")
          if [ "$NAME" != "Bella" ]; then
            echo "::error::dogs.id=78 is not named Bella (got '${NAME}'). Aborting without deleting anything."
            exit 1
          fi

          APPT=$($MYSQL -e "SELECT COUNT(*) FROM appointment_dog WHERE dog_id=78;")
          VAX=$($MYSQL -e "SELECT COUNT(*) FROM vaccination_records WHERE dog_id=78;")
          DOCS=$($MYSQL -e "SELECT COUNT(*) FROM client_documents WHERE dog_id=78;")
          if [ "$APPT" != "0" ] || [ "$VAX" != "0" ] || [ "$DOCS" != "0" ]; then
            echo "::error::dog id=78 has linked records (appointments=${APPT}, vaccinations=${VAX}, documents=${DOCS}). Aborting -- this needs a merge, not a plain delete."
            exit 1
          fi
          echo "Confirmed: dogs.id=78 is 'Bella' with no linked records. Proceeding."

      - name: Back up the row before deleting
        run: |
          set -euo pipefail
          mysqldump \
            --host="$DB_HOST" --port="${DB_PORT:-3306}" \
            --user="$DB_USERNAME" --password="$DB_PASSWORD" \
            --single-transaction --no-create-info --column-statistics=0 \
            --where="id=78" \
            "$DB_DATABASE" dogs > dog-78-backup.sql
          cat dog-78-backup.sql

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: dog-78-backup-${{ github.run_id }}
          path: dog-78-backup.sql
          retention-days: 30
          if-no-files-found: error

      - name: Delete dog id 78
        run: |
          set -euo pipefail
          mysql --host="$DB_HOST" --port="${DB_PORT:-3306}" \
            --user="$DB_USERNAME" --password="$DB_PASSWORD" \
            -e "DELETE FROM dogs WHERE id=78;" "$DB_DATABASE"
          echo "### Deleted dogs.id=78 (duplicate Bella)" >> "$GITHUB_STEP_SUMMARY"
